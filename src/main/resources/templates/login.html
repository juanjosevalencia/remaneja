<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remaneja — Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/remaneja.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="liquidNavbar d-flex align-items-center">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="brandLogo" th:href="@{/portal}">
                <span class="brandDot"></span>
                <span>Remaneja</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a class="appleNavLink" th:href="@{/portal}">Catálogo</a>
                <a class="btnAppleSecondary btnAppleSmall" th:href="@{/register}">Crear cuenta</a>
            </div>
        </div>
    </nav>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-sm-10 col-md-7 col-lg-5 col-xl-4">
                <div class="appleCard p-4 p-md-5">
                    <p class="eyebrowLabel text-center">Acceso Clientes</p>
                    <h1 class="sectionHeading text-center fs-3 mb-2">Inicia sesión</h1>
                    <p class="text-secondary small text-center mb-4">Ingresa con tu correo registrado para publicar autos o enviar ofertas.</p>

                    <div class="appleAlertError mb-3" th:if="${mensajeError}" th:text="${mensajeError}"></div>
                    <div class="appleAlertSuccess mb-3" th:if="${mensajeExito}" th:text="${mensajeExito}"></div>

                    <form th:action="@{/login}" method="post">
                        <div class="mb-3">
                            <label class="appleFormLabel" for="email">Correo Electrónico</label>
                            <input type="email" id="email" name="email" class="appleInput" placeholder="tu@correo.com" required>
                        </div>

                        <div class="mb-4">
                            <label class="appleFormLabel" for="password">Contraseña</label>
                            <input type="password" id="password" name="password" class="appleInput" placeholder="••••••••" required>
                        </div>

                        <button type="submit" class="btnApplePrimary w-100 justify-content-center mb-3">Continuar</button>
                    </form>

                    <div class="text-center pt-3 border-top" style="border-color: var(--borderLight) !important;">
                        <span class="text-secondary small">¿Aún no tienes cuenta? </span>
                        <a th:href="@{/register}" class="appleLink small">Regístrate aquí ›</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="appleFooter mt-auto">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>Remaneja — Mercado de Vehículos Usados</span>
            <a th:href="@{/}" class="appleLink small">Acceso Administración ›</a>
        </div>
    </footer>

</body>
</html>
