<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remaneja — Crear Cuenta</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/remaneja.css}">
    <link rel="icon" type="image/svg+xml" th:href="@{/favicon.svg}">
</head>
<body class="d-flex flex-column min-vh-100">

    <nav class="liquidNavbar d-flex align-items-center">
        <div class="container d-flex justify-content-between align-items-center">
            <a class="brandLogo" th:href="@{/portal}">
                <span class="brandDot"></span>
                <span>Remaneja</span>
            </a>
            <div class="d-flex align-items-center gap-2">
                <a class="appleNavLink" th:href="@{/portal}">Catálogo</a>
                <a class="btnAppleSecondary btnAppleSmall" th:href="@{/login}">Iniciar sesión</a>
            </div>
        </div>
    </nav>

    <main class="container my-auto py-5">
        <div class="row justify-content-center">
            <div class="col-sm-11 col-md-8 col-lg-6 col-xl-5">
                <div class="appleCard p-4 p-md-5">
                    <p class="eyebrowLabel text-center">Nuevo Perfil</p>
                    <h1 class="sectionHeading text-center fs-3 mb-2">Crea tu cuenta Remaneja</h1>
                    <p class="text-secondary small text-center mb-4">Compra o vende vehículos usados con trazabilidad directa.</p>

                    <div class="appleAlertError mb-3" th:if="${mensajeError}" th:text="${mensajeError}"></div>

                    <form th:action="@{/register}" th:object="${nuevoCliente}" method="post">
                        <div class="mb-3">
                            <label class="appleFormLabel" for="id">Documento de Identidad</label>
                            <input type="number" id="id" th:field="*{id}" class="appleInput" placeholder="Ej. 1001234567" required>
                        </div>

                        <div class="mb-3">
                            <label class="appleFormLabel" for="name">Nombre Completo</label>
                            <input type="text" id="name" th:field="*{name}" class="appleInput" placeholder="Ej. Juan José Valencia" maxlength="100" required>
                        </div>

                        <div class="mb-3">
                            <label class="appleFormLabel" for="email">Correo Electrónico</label>
                            <input type="email" id="email" th:field="*{email}" class="appleInput" placeholder="correo@ejemplo.com" maxlength="100" required>
                        </div>

                        <div class="row g-2 mb-3">
                            <div class="col-7">
                                <label class="appleFormLabel" for="phoneNumber">Teléfono de Contacto</label>
                                <input type="text" id="phoneNumber" th:field="*{phoneNumber}" class="appleInput" placeholder="3001234567" maxlength="45" required>
                            </div>
                            <div class="col-5">
                                <label class="appleFormLabel" for="age">Edad</label>
                                <input type="number" id="age" th:field="*{age}" class="appleInput" placeholder="22" min="18" max="120" required>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="appleFormLabel" for="password">Contraseña</label>
                            <input type="password" id="password" th:field="*{password}" class="appleInput" placeholder="Mínimo 4 caracteres" maxlength="45" required>
                        </div>

                        <button type="submit" class="btnApplePrimary w-100 justify-content-center mb-3">Registrarme y Entrar</button>
                    </form>

                    <div class="text-center pt-3 border-top" style="border-color: var(--borderLight) !important;">
                        <span class="text-secondary small">¿Ya tienes cuenta? </span>
                        <a th:href="@{/login}" class="appleLink small">Inicia sesión ›</a>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="appleFooter mt-auto">
        <div class="container d-flex flex-wrap justify-content-between align-items-center gap-2">
            <span>Remaneja — Plataforma Cliente</span>
            <span>Spring Boot • Thymeleaf • MySQL</span>
        </div>
    </footer>

</body>
</html>
